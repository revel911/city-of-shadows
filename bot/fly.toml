# Fly.io config for the City of Shadows Discord bot.
# Deploy with: fly deploy
# Set secrets with: fly secrets set DISCORD_TOKEN=... DEEPSEEK_API_KEY=... GITHUB_TOKEN=...

app = "cos-bot-revel911"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  GITHUB_REPO = "city-of-shadows"
  GITHUB_BRANCH = "main"
  ARCHIVE_GITHUB_OWNER = "revel911"
  ARCHIVE_GITHUB_REPO = "city-of-shadows-archive"
  ARCHIVE_GITHUB_BRANCH = "main"
  ARCHIVE_SPOOL_DIR = "/data/archive-spool"
  # Live-session snapshots (transcript, pending roll, draft) for restart resume.
  RUNTIME_DIR = "/data/runtime"

[mounts]
  source = "archive_data"
  destination = "/data"

# Gateway bot — no inbound traffic, just a persistent worker.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
